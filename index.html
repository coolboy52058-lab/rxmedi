<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭慢箋管理系統 v26.0 - 專業護眼版</title>
    <style>
        :root {
            --bg-body: #f0f4f8;
            --bg-card: #ffffff;
            --text-main: #1a202c;
            --text-sub: #4a5568;
            --color-primary: #3182ce;    /* 正常：藍色 */
            --color-warning: #dd6b20;    /* 警告：橘色 (14天內) */
            --color-danger: #e53e3e;     /* 危險：紅色 (7天內) */
            --color-success: #38a169;    /* 領藥按鈕：綠色 */
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            padding: 15px; 
            max-width: 650px; 
            margin: 0 auto; 
            font-size: 18px; /* 長輩友善字體 */
            line-height: 1.6;
        }

        h2 { text-align: center; color: var(--color-primary); margin: 20px 0; font-size: 1.8rem; font-weight: 800; }

        /* 備份按鈕 */
        .backup-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-backup { 
            background: white; border: 2px solid #e2e8f0; padding: 12px; 
            border-radius: var(--radius-md); font-weight: bold; cursor: pointer; color: var(--text-sub);
        }

        /* 輸入框區塊 */
        .input-card {
            background: white; padding: 25px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow); margin-bottom: 25px; border-top: 8px solid var(--color-primary);
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--text-sub); font-size: 0.9em; }
        input { 
            width: 100%; padding: 12px; border: 2px solid #edf2f7; border-radius: var(--radius-md); 
            font-size: 18px; background: #fcfdf2; 
        }
        .btn-save { 
            background: var(--color-success); color: white; width: 100%; padding: 16px; 
            border: none; border-radius: var(--radius-md); font-size: 1.2rem; font-weight: 800; cursor: pointer;
        }

        /* 紀錄呈現區 */
        .group-container { margin-bottom: 35px; }
        .group-header { 
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 12px; padding: 0 10px;
        }
        .user-info { border-left: 6px solid var(--color-primary); padding-left: 12px; }
        .user-info b { font-size: 1.5rem; display: block; }
        .user-info span { color: var(--text-sub); font-size: 1.1rem; }
        .total-badge { background: #cbd5e0; padding: 5px 12px; border-radius: 8px; font-weight: bold; }

        /* 藥物卡片核心 */
        .med-card {
            background: white; border-radius: var(--radius-lg); padding: 22px;
            box-shadow: var(--shadow); margin-bottom: 18px; border: 2px solid transparent;
        }
        .med-card.active { border-color: var(--color-primary); }

        .hand-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .hand-num { font-size: 3.5rem; font-weight: 900; line-height: 1; }
        .hand-num small { font-size: 1.2rem; font-weight: bold; margin-left: 5px; }
        
        .status-tag { padding: 6px 15px; border-radius: 50px; font-weight: 800; font-size: 1rem; }

        /* 進度條 */
        .pg-bg { height: 16px; background: #edf2f7; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .pg-fill { height: 100%; transition: width 0.6s ease; }

        /* 詳情格 */
        .info-grid { 
            display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 10px; 
            background: #f7fafc; padding: 15px; border-radius: var(--radius-md);
        }
        .info-cell span { display: block; color: var(--text-sub); font-size: 0.85rem; font-weight: bold; }
        .info-cell b { font-size: 1.05rem; }

        /* 領藥日期標籤 */
        .log-box { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 6px; }
        .log-tag { background: white; border: 1px solid #e2e8f0; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; color: var(--text-sub); }

        /* 卡片按鈕 */
        .card-btns { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-card { 
            padding: 12px; border-radius: var(--radius-md); border: 2px solid #e2e8f0; 
            background: white; font-weight: bold; cursor: pointer; font-size: 1rem;
        }
        .btn-plus { background: #e6fffa; color: var(--color-success); border-color: #b2f5ea; }
        
        /* 顏色定義 - 嚴格遵守原廠設定 */
        .c-primary { color: var(--color-primary); }
        .c-warning { color: var(--color-warning); } /* 14天 */
        .c-danger { color: var(--color-danger); }   /* 7天 */

        .bg-primary { background-color: var(--color-primary); }
        .bg-warning { background-color: var(--color-warning); }
        .bg-danger { background-color: var(--color-danger); }

        .tag-primary { background: #ebf8ff; color: var(--color-primary); }
        .tag-warning { background: #fffaf0; color: var(--color-warning); }
        .tag-danger { background: #fff5f5; color: var(--color-danger); }

        #importFile { display: none; }
        .sim-bar { background: #e2e8f0; padding: 12px; border-radius: var(--radius-md); margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>

<h2>🏠 家庭慢箋管家</h2>

<div class="backup-bar">
    <button class="btn-backup" onclick="exportJSON()">📤 備份紀錄</button>
    <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 匯入紀錄</button>
    <input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
</div>

<div class="input-card">
    <div class="form-grid">
        <div>
            <label>誰要吃藥</label>
            <input type="text" id="userName" placeholder="例如：爸爸">
        </div>
        <div>
            <label>藥物名稱</label>
            <input type="text" id="medName" placeholder="例如：血壓藥">
        </div>
    </div>
    <div class="form-grid">
        <div>
            <label>第 1 次領藥日</label>
            <input type="date" id="startDate">
        </div>
        <div>
            <label>單次天數</label>
            <input type="number" id="days" value="30">
        </div>
    </div>
    <button class="btn-save" onclick="saveRecord()">💾 儲存這張慢箋</button>
</div>

<div class="sim-bar">
    <b>檢視基準日：</b>
    <input type="date" id="simDate" style="width:auto; padding:5px; font-size:16px;">
    <button onclick="renderRecords()" style="padding:5px 10px; cursor:pointer;">更新</button>
</div>

<div id="records"></div>

<script>
    // --- 核心邏輯 (完全保留原版功能與計算) ---
    const STORAGE_KEY = "family_med_v25";
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = todayStr;
    document.getElementById('simDate').value = todayStr;

    function exportJSON() {
        if (records.length === 0) return alert("沒有紀錄可備份。");
        const dataStr = JSON.stringify(records, null, 2);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const link = document.createElement('a');
        link.setAttribute('href', dataUri);
        link.setAttribute('download', `慢箋備份_${todayStr}.json`);
        link.click();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data) && confirm("確定匯入並覆蓋現有紀錄嗎？")) {
                    records = data; sync();
                }
            } catch (err) { alert("讀取失敗"); }
        };
        reader.readAsText(file);
    }

    function calculateV25(r, targetDateStr) {
        const simDate = new Date(targetDateStr);
        simDate.setHours(0,0,0,0);
        const logs = r.logs.map(d => {
            const dt = new Date(d); dt.setHours(0,0,0,0); return dt;
        }).sort((a,b) => a - b);

        const firstLogDate = logs[0] || new Date(r.startDate);
        const endDate = new Date(firstLogDate);
        endDate.setDate(endDate.getDate() + 89); 

        let totalGapDays = 0;
        let currentDrugEmptyDate = new Date(logs[0]); 
        for(let i=0; i < logs.length; i++) {
            if (i > 0 && logs[i] > currentDrugEmptyDate) {
                totalGapDays += Math.floor((logs[i] - currentDrugEmptyDate) / 86400000);
            }
            let drugStartDate = (i > 0 && logs[i] < currentDrugEmptyDate) ? currentDrugEmptyDate : logs[i];
            currentDrugEmptyDate = new Date(drugStartDate);
            currentDrugEmptyDate.setDate(currentDrugEmptyDate.getDate() + r.days);
        }

        const daysPassed = Math.floor((simDate - firstLogDate) / 86400000);
        const daysRemaining = 90 - daysPassed; 
        
        let hand = (logs.length * r.days - daysPassed) + totalGapDays;
        hand = Math.max(0, Math.min(logs.length * r.days, hand));

        const progressPercent = Math.min(100, Math.max(0, (daysPassed / 90) * 100));
        const isExpired = simDate > endDate;
        const format = (d) => d.getFullYear() + "/" + String(d.getMonth()+1).padStart(2,'0') + "/" + String(d.getDate()).padStart(2,'0');
        
        // --- 顏色邏輯：嚴格遵守使用者設定 ---
        let level = "primary"; // 藍色
        if (daysRemaining <= 7) level = "danger";  // 7天變紅
        else if (daysRemaining <= 14) level = "warning"; // 14天變橘

        return {
            hand,
            totalRemain: isExpired ? 0 : Math.max(0, (r.totalTimes - logs.length) * r.days),
            isExpired,
            status: isExpired ? "慢箋已過期" : (hand > 0 ? "服用中" : "已停藥"),
            range: `${format(firstLogDate)} ~ ${format(endDate)}`,
            count: logs.length,
            percent: progressPercent,
            level
        };
    }

    function saveRecord() {
        const start = document.getElementById("startDate").value;
        if(!start) return alert("請選日期");
        records.push({
            id: Date.now(), user: document.getElementById("userName").value || "家人",
            med: document.getElementById("medName").value || "藥物",
            startDate: start, days: parseInt(document.getElementById("days").value),
            totalTimes: 3, logs: [start], isEditing: false
        });
        sync();
        document.getElementById("medName").value = '';
    }

    function sync() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); renderRecords(); }

    function renderRecords() {
        const container = document.getElementById("records");
        container.innerHTML = "";
        const simDateStr = document.getElementById('simDate').value;

        const groups = {};
        records.forEach(r => {
            const key = `${r.user}-${r.med}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(r);
        });

        Object.keys(groups).sort().forEach(key => {
            const groupRecords = groups[key].sort((a,b) => new Date(b.startDate) - new Date(a.startDate));
            const [user, med] = key.split('-');
            let groupHand = 0;
            groupRecords.forEach(r => groupHand += calculateV25(r, simDateStr).hand);

            const groupDiv = document.createElement("div");
            groupDiv.className = "group-container";
            groupDiv.innerHTML = `
                <div class="group-header">
                    <div class="user-info"><b>${user}</b><span>${med}</span></div>
                    <div class="total-badge">總藥量 ${groupHand} 天</div>
                </div>
            `;

            groupRecords.forEach(r => {
                const calc = calculateV25(r, simDateStr);
                const card = document.createElement("div");
                card.className = `med-card ${!calc.isExpired && calc.hand > 0 ? 'active' : ''}`;
                
                card.innerHTML = `
                    <div class="hand-area">
                        <div class="hand-num c-${calc.level}">${calc.hand}<small>天</small></div>
                        <div class="status-tag tag-${calc.level}">${calc.status}</div>
                    </div>

                    <div class="pg-bg"><div class="pg-fill bg-${calc.level}" style="width:${calc.percent}%"></div></div>

                    <div class="info-grid">
                        <div class="info-cell"><span>慢箋效期 (90天)</span><b>${calc.range}</b></div>
                        <div class="info-cell"><span>領取進度</span><b>${calc.count} / ${r.totalTimes} 次</b></div>
                        <div class="info-cell"><span>未領藥量</span><b>${calc.totalRemain} 天</b></div>
                    </div>

                    <div class="log-box">
                        ${r.logs.map(l => `<span class="log-tag">${l}</span>`).join('')}
                    </div>

                    <div class="card-btns">
                        <button class="btn-card btn-plus" onclick="addLog(${r.id})">➕ 新增領藥</button>
                        <button class="btn-card" onclick="deleteRecord(${r.id})">🗑️ 刪除</button>
                        <button class="btn-card" onclick="alert('請手動點擊上方新增領藥')">⚙️ 修改</button>
                    </div>
                `;
                groupDiv.appendChild(card);
            });
            container.appendChild(groupDiv);
        });
    }

    function addLog(id) {
        const r = records.find(r => r.id === id);
        if(r.logs.length >= 3) return alert("此箋已領完！");
        const d = prompt("領藥日期:", document.getElementById('simDate').value);
        if(d) { r.logs.push(d); sync(); }
    }

    function deleteRecord(id) { if(confirm("確定刪除此張慢箋紀錄？")) { records = records.filter(r => r.id !== id); sync(); } }

    renderRecords();
</script>
</body>
</html>
