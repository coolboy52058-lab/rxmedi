<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭慢箋管理 - 強化版</title>
    <style>
        :root {
            --bg-page: #f2f5f8;
            --primary: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --text-title: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-body); 
            padding: 10px; 
            max-width: 900px; 
            margin: 0 auto; 
            line-height: 1.4;
        }

        /* 頂部標題 */
        .app-header { text-align: center; padding: 20px 0; }
        .app-header h1 { font-size: 28px; margin: 0; color: var(--text-title); font-weight: 900; }
        .app-header span { font-size: 14px; color: var(--text-muted); font-weight: bold; }

        /* 備份區與主要輸入區 */
        .action-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-ghost { 
            flex: 1; padding: 10px; background: white; border: 2px solid #e2e8f0; 
            border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 14px;
        }

        .main-form { 
            background: white; padding: 25px; border-radius: 20px; 
            box-shadow: var(--card-shadow); border: 2px solid #e2e8f0; margin-bottom: 25px; 
        }
        
        .field-group { margin-bottom: 15px; }
        label { display: block; font-size: 16px; font-weight: 800; color: var(--text-title); margin-bottom: 8px; }
        
        input { 
            width: 100%; padding: 15px; border: 3px solid #f1f5f9; border-radius: 12px; 
            font-size: 18px; font-weight: 600; background: #f8fafc; transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); background: white; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }

        /* 大按鈕 */
        .btn-full { 
            width: 100%; padding: 18px; border: none; border-radius: 15px; 
            font-size: 18px; font-weight: 900; cursor: pointer; transition: transform 0.1s;
        }
        .btn-full:active { transform: scale(0.98); }
        .btn-save { background: var(--success); color: white; margin-top: 10px; }
        .btn-calc { background: #f1f5f9; color: var(--text-body); border: 2px solid #e2e8f0; }

        /* 更新圖卡日期區塊 */
        .sim-control { 
            background: #1e293b; color: white; padding: 20px; 
            border-radius: 15px; margin-bottom: 30px; display: flex; align-items: center; gap: 15px;
        }
        .sim-control label { color: #cbd5e0; margin: 0; flex-shrink: 0; }
        .sim-control input { background: #334155; border: none; color: white; padding: 10px; }

        /* --- 藥物卡片設計 --- */
        .group-card { 
            background: white; border-radius: 24px; padding: 20px; 
            box-shadow: var(--card-shadow); margin-bottom: 30px; border: 1px solid #e2e8f0;
        }
        
        .group-header { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 15px;
        }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-size: 16px; font-weight: 800; color: var(--primary); background: #eff6ff; padding: 4px 12px; border-radius: 8px; width: fit-content; }
        .med-name { font-size: 26px; font-weight: 900; color: var(--text-title); margin-top: 5px; }
        
        .mega-badge { 
            background: #fff7ed; border: 2px solid #fdba74; padding: 10px 15px; 
            border-radius: 15px; text-align: center; min-width: 110px;
        }
        .mega-badge .label { font-size: 12px; color: #9a3412; font-weight: 800; display: block; }
        .mega-badge .value { font-size: 28px; color: #c2410c; font-weight: 950; display: block; line-height: 1; margin-top: 4px; }

        /* 慢箋單張卡片 */
        .med-item { 
            background: #f8fafc; border-radius: 18px; padding: 15px; 
            margin-bottom: 12px; border: 1px solid #e2e8f0; position: relative;
        }
        .active-item { border-left: 8px solid var(--primary); background: white; }
        
        .item-meta { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; }
        
        /* 進度條加大 */
        .progress-box { height: 16px; background: #e2e8f0; border-radius: 20px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; transition: width 0.5s ease; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .data-cell { background: #f1f5f9; padding: 12px; border-radius: 12px; }
        .cell-label { font-size: 13px; font-weight: 800; color: var(--text-muted); display: block; }
        .cell-value { font-size: 18px; font-weight: 800; color: var(--text-title); display: block; }

        /* 標籤樣式 */
        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 900; }
        .pill-active { background: #dcfce7; color: #166534; }
        .pill-expired { background: #fee2e2; color: #991b1b; }

        .log-list { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
        .log-pill { background: white; border: 1px solid #cbd5e0; padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: 600; }

        /* 按鈕群組 */
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn-op { flex: 1; padding: 10px; border-radius: 10px; font-weight: 800; border: none; cursor: pointer; font-size: 14px; }
        .btn-edit { background: #e2e8f0; color: var(--text-body); }
        .btn-del { background: #fee2e2; color: var(--danger); }
        .btn-add-log { background: #dcfce7; color: var(--success); }

        #tempResult { font-size: 20px; font-weight: 900; margin-top: 15px; border-radius: 15px; }
    </style>
</head>
<body>

<div class="app-header">
    <h1>家庭慢箋管理</h1>
    <span>v25.1 強化版介面</span>
</div>

<div class="action-row">
    <button class="btn-ghost" onclick="exportJSON()">📤 匯出備份</button>
    <button class="btn-ghost" onclick="document.getElementById('importFile').click()">📥 匯入紀錄</button>
    <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" style="display:none">
</div>

<div class="main-form">
    <div class="form-grid">
        <div class="field-group">
            <label>對象姓名</label>
            <input type="text" id="userName" placeholder="例如：爸爸">
        </div>
        <div class="field-group">
            <label>藥物名稱</label>
            <input type="text" id="medName" placeholder="例如：高血壓藥">
        </div>
    </div>
    <div class="form-grid">
        <div class="field-group">
            <label>第1次領藥日期</label>
            <input type="date" id="startDate">
        </div>
        <div class="field-group">
            <label>單次開立天數</label>
            <input type="number" id="days" value="30">
        </div>
    </div>
    <div class="form-grid">
        <div class="field-group">
            <label>總領藥次數</label>
            <input type="number" id="totalTimes" value="3">
        </div>
        <div class="field-group">
            <label>已領次數</label>
            <input type="number" id="usedTimes" value="1">
        </div>
    </div>
    <button class="btn-full btn-calc" onclick="runSimulation()">🧪 試算結果</button>
    <button class="btn-full btn-save" onclick="saveRecord()">💾 儲存紀錄</button>
    <div id="tempResult" style="display:none; padding:15px; text-align:center; background:#f0fdf4; border:2px solid #bbf7d0;"></div>
</div>

<div class="sim-control">
    <label>📆 試算基準日：</label>
    <input type="date" id="simDate">
    <button class="btn-ghost" style="flex:none; padding:10px 20px;" onclick="renderRecords()">🔄 更新資訊</button>
</div>

<div id="records"></div>

<script>
    // --- 核心邏輯保持與原版一致，僅更新 UI 渲染結構 ---
    const STORAGE_KEY = "family_med_v25";
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    
    document.getElementById('startDate').valueAsDate = new Date();
    document.getElementById('simDate').valueAsDate = new Date();

    function exportJSON() {
        if (records.length === 0) return alert("沒有紀錄可備份");
        const dataStr = JSON.stringify(records, null, 2);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const link = document.createElement('a');
        link.setAttribute('href', dataUri);
        link.setAttribute('download', `藥物紀錄備份_${new Date().toLocaleDateString()}.json`);
        link.click();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (confirm("匯入將蓋過現有資料，確定嗎？")) {
                    records = data;
                    sync();
                    alert("匯入成功！");
                }
            } catch (err) { alert("讀取失敗"); }
        };
        reader.readAsText(file);
    }

    function calculateV25(r, targetDateStr) {
        const simDate = new Date(targetDateStr);
        simDate.setHours(0,0,0,0);
        const logs = r.logs.map(d => {
            const dt = new Date(d);
            dt.setHours(0,0,0,0);
            return dt;
        }).sort((a,b) => a - b);

        const firstLogDate = logs[0] || new Date(r.startDate);
        const endDate = new Date(firstLogDate);
        endDate.setDate(endDate.getDate() + 89); 

        let totalGapDays = 0;
        let currentDrugEmptyDate = new Date(logs[0]); 
        
        for(let i=0; i < logs.length; i++) {
            if (i > 0 && logs[i] > currentDrugEmptyDate) {
                totalGapDays += Math.floor((logs[i] - currentDrugEmptyDate) / 86400000);
            }
            let drugStartDate = (i > 0 && logs[i] < currentDrugEmptyDate) ? currentDrugEmptyDate : logs[i];
            currentDrugEmptyDate = new Date(drugStartDate);
            currentDrugEmptyDate.setDate(currentDrugEmptyDate.getDate() + r.days);
        }

        const daysPassed = Math.floor((simDate - firstLogDate) / 86400000);
        const hand = Math.max(0, (logs.length * r.days - daysPassed) + totalGapDays);
        const progressPercent = Math.min(100, Math.max(0, (daysPassed / 90) * 100));
        
        let barColor = "var(--primary)";
        if (90 - daysPassed <= 7) barColor = "var(--danger)";
        else if (90 - daysPassed <= 14) barColor = "var(--warning)";

        const isExpired = simDate > endDate;
        return {
            hand: Math.round(hand),
            percent: progressPercent,
            barColor,
            isExpired,
            range: `${firstLogDate.toLocaleDateString()} - ${endDate.toLocaleDateString()}`,
            count: logs.length
        };
    }

    function runSimulation() {
        const r = {
            startDate: document.getElementById("startDate").value,
            days: parseInt(document.getElementById("days").value),
            totalTimes: parseInt(document.getElementById("totalTimes").value),
            logs: Array(parseInt(document.getElementById("usedTimes").value)).fill(document.getElementById("startDate").value)
        };
        const res = calculateV25(r, document.getElementById("simDate").value);
        const div = document.getElementById("tempResult");
        div.style.display = "block";
        div.innerHTML = `手上餘藥：<span style="color:var(--danger)">${res.hand} 天</span>`;
    }

    function saveRecord() {
        records.push({
            id: Date.now(),
            user: document.getElementById("userName").value || "家人",
            med: document.getElementById("medName").value || "未命名藥物",
            startDate: document.getElementById("startDate").value,
            days: parseInt(document.getElementById("days").value),
            totalTimes: parseInt(document.getElementById("totalTimes").value),
            logs: Array(parseInt(document.getElementById("usedTimes").value)).fill(document.getElementById("startDate").value),
            isEditing: false
        });
        sync();
    }

    function sync() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); renderRecords(); }

    function renderRecords() {
        const container = document.getElementById("records");
        container.innerHTML = "";
        const simDateStr = document.getElementById("simDate").value;

        const groups = {};
        records.forEach(r => {
            const key = `${r.user}-${r.med}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(r);
        });

        Object.keys(groups).sort().forEach(key => {
            const groupRecords = groups[key].sort((a,b) => new Date(b.startDate) - new Date(a.startDate));
            const [user, med] = key.split('-');
            let sumHand = 0;
            groupRecords.forEach(r => sumHand += calculateV25(r, simDateStr).hand);

            const groupDiv = document.createElement("div");
            groupDiv.className = "group-card";
            groupDiv.innerHTML = `
                <div class="group-header">
                    <div class="user-info">
                        <span class="user-name">${user}</span>
                        <span class="med-name">${med}</span>
                    </div>
                    <div class="mega-badge">
                        <span class="label">藥物總庫存</span>
                        <span class="value">${sumHand} 天</span>
                    </div>
                </div>
                <div id="sub-${key}"></div>
            `;

            const subContainer = groupDiv.querySelector(`#sub-${key}`);
            groupRecords.forEach(r => {
                const calc = calculateV25(r, simDateStr);
                const item = document.createElement("div");
                item.className = `med-item ${!calc.isExpired ? 'active-item' : ''}`;
                
                item.innerHTML = `
                    <div class="item-meta">
                        <span>🗓️ 效期: ${calc.range}</span>
                        <span class="status-pill ${calc.isExpired ? 'pill-expired' : 'pill-active'}">
                            ${calc.isExpired ? '已過期' : '有效中'}
                        </span>
                    </div>
                    <div class="progress-box">
                        <div class="progress-fill" style="width:${calc.percent}%; background:${calc.barColor}"></div>
                    </div>
                    <div class="data-grid">
                        <div class="data-cell"><span class="cell-label">次數</span><span class="cell-value">${calc.count}/${r.totalTimes}</span></div>
                        <div class="data-cell"><span class="cell-label">此張餘藥</span><span class="cell-value" style="color:var(--danger)">${calc.hand} 天</span></div>
                    </div>
                    <div class="log-list">
                        ${r.logs.map(l => `<span class="log-pill">${l}</span>`).join('')}
                    </div>
                    <div class="btn-group">
                        <button class="btn-op btn-add-log" onclick="addLog(${r.id})">+ 領藥</button>
                        <button class="btn-op btn-del" onclick="deleteRecord(${r.id})">刪除</button>
                    </div>
                `;
                subContainer.appendChild(item);
            });
            container.appendChild(groupDiv);
        });
    }

    function addLog(id) {
        const r = records.find(r => r.id === id);
        const date = prompt("請輸入領藥日期:", document.getElementById('simDate').value);
        if (date) { r.logs.push(date); sync(); }
    }
    function deleteRecord(id) { if(confirm("確定刪除？")) { records = records.filter(r => r.id !== id); sync(); } }

    renderRecords();
</script>
</body>
</html>
