<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭慢箋管理系統 v26.1</title>
    <style>
        :root {
            --bg-body: #f4f7f9;
            --bg-card: #ffffff;
            --text-main: #1a202c;
            --text-sub: #4a5568;
            --color-primary: #3182ce;
            --color-success: #38a169;
            --color-warning: #dd6b20;
            --color-danger: #e53e3e;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background-color: var(--bg-body); color: var(--text-main); 
            padding: 15px; max-width: 700px; margin: 0 auto; 
            font-size: 18px; line-height: 1.6;
        }

        h2 { text-align: center; color: var(--color-primary); margin: 20px 0; font-size: 1.8rem; font-weight: 800; }

        /* 備份區 */
        .backup-zone { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .btn-backup { 
            background: white; border: 2px solid #cbd5e0; padding: 12px; border-radius: var(--radius-md);
            font-size: 15px; font-weight: bold; color: var(--text-sub); cursor: pointer;
        }
        .btn-backup small { display: block; font-size: 12px; font-weight: normal; margin-top: 2px; }

        /* 輸入與試算區 */
        .box { 
            background: var(--bg-card); padding: 22px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow); margin-bottom: 25px; border-top: 6px solid var(--color-primary);
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: var(--text-sub); font-size: 0.9em; }
        input { 
            width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: var(--radius-md); 
            font-size: 18px; background: #fcfdf2; 
        }
        input:focus { outline: none; border-color: var(--color-primary); background: white; }

        .btn-main { 
            width: 100%; padding: 15px; border: none; border-radius: var(--radius-md); 
            font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .btn-calc { background: #edf2f7; color: var(--color-primary); border: 2px solid var(--color-primary); margin-bottom: 10px; }
        .btn-save { background: var(--color-success); color: white; }
        
        #tempResult { 
            margin-top: 15px; padding: 15px; border-radius: var(--radius-md); 
            background: #f0fff4; border: 1px solid #c6f6d5; color: var(--color-success); 
            text-align: center; font-weight: bold; 
        }

        /* 基準日設定區 */
        .sim-bar { 
            background: #e2e8f0; padding: 15px; border-radius: var(--radius-md); 
            margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* 紀錄卡片 */
        .group-box { margin-bottom: 30px; }
        .group-header { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            padding: 0 10px 10px 10px;
        }
        .user-tag { border-left: 6px solid var(--color-primary); padding-left: 12px; }
        .user-tag b { font-size: 1.6rem; display: block; }
        .user-tag span { color: var(--text-sub); }
        .total-badge { background: #fffaf0; border: 1px solid #feebc8; color: #c05621; padding: 8px 15px; border-radius: 12px; font-weight: 800; }

        .card { 
            background: white; border-radius: var(--radius-lg); padding: 20px; 
            box-shadow: var(--shadow); margin-bottom: 15px; border-left: 8px solid transparent;
        }
        .card.active-card { border-left-color: var(--color-primary); }

        .hand-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .hand-num { font-size: 3rem; font-weight: 900; }
        .hand-num small { font-size: 1.1rem; margin-left: 4px; }
        .status-badge { padding: 6px 14px; border-radius: 50px; font-weight: 800; font-size: 0.9rem; }

        .progress-container { width: 100%; background: #edf2f7; border-radius: 10px; height: 14px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; transition: width 0.6s ease; }

        .info-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            background: #f8fafc; padding: 15px; border-radius: var(--radius-md);
        }
        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 0.8rem; color: var(--text-sub); font-weight: bold; }
        .info-value { font-weight: bold; font-size: 1rem; }
        .full { grid-column: span 2; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 5px; }

        /* 標籤 */
        .log-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .log-tag { background: white; border: 1px solid #e2e8f0; padding: 3px 8px; border-radius: 6px; font-size: 0.85rem; }

        /* 編輯模式 */
        .edit-box { background: #fff; border: 3px dashed var(--color-primary); padding: 15px; border-radius: var(--radius-md); }
        .log-edit-item { display: flex; align-items: center; gap: 8px; margin-top: 8px; background: #f7fafc; padding: 8px; border-radius: 8px; }

        /* 顏色控制 */
        .c-primary { color: var(--color-primary); }
        .c-warning { color: var(--color-warning); }
        .c-danger { color: var(--color-danger); }
        .bg-primary { background-color: var(--color-primary); }
        .bg-warning { background-color: var(--color-warning); }
        .bg-danger { background-color: var(--color-danger); }
        .pill-active { background: #f0fff4; color: var(--color-success); border: 1px solid #c6f6d5; }
        .pill-expired { background: #fff5f5; color: var(--color-danger); border: 1px solid #fed7d7; }

        .btn-sm { padding: 10px; border-radius: 8px; border: 1px solid #cbd5e0; background: white; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-plus { background: #e6fffa; color: var(--color-success); border-color: #b2f5ea; }

        #importFile { display: none; }
    </style>
</head>
<body>

<h2>家庭慢箋管理系統</h2>

<div class="backup-zone">
    <button class="btn-backup" onclick="exportJSON()">備份全部記錄<small>(換手機或存檔用)</small></button>
    <button class="btn-backup" onclick="document.getElementById('importFile').click()">找回舊的紀錄<small>(從手機檔案讀取)</small></button>
    <input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
</div>

<div class="box">
    <div class="grid">
        <div><label>對象</label><input type="text" id="userName" placeholder="例如：爸爸"></div>
        <div><label>藥品名稱</label><input type="text" id="medName" placeholder="例如：血壓藥"></div>
    </div>
    <div class="grid">
        <div><label>第 1 次領藥日</label><input type="date" id="startDate"></div>
        <div><label>單次開立天數</label><input type="number" id="days" value="30"></div>
    </div>
    <div class="grid">
        <div><label>總領藥次數</label><input type="number" id="totalTimes" value="3"></div>
        <div><label>初始已領次數</label><input type="number" id="usedTimes" value="1"></div>
    </div>
    <button class="btn-main btn-calc" onclick="runSimulation()">試算不儲存</button>
    <button class="btn-main btn-save" onclick="saveRecord()">儲存紀錄</button>
    <div id="tempResult" style="display:none;"></div>
</div>

<div class="sim-bar">
    <b>檢視基準日：</b>
    <input type="date" id="simDate">
    <button class="btn-sm" onclick="renderRecords()">更新</button>
</div>

<div id="records"></div>

<script>
    const STORAGE_KEY = "family_med_v25";
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    
    // 初始化日期
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('startDate').value = todayStr;
    document.getElementById('simDate').value = todayStr;

    function exportJSON() {
        if (records.length === 0) return alert("目前沒有紀錄。");
        const dataStr = JSON.stringify(records, null, 2);
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const link = document.createElement('a');
        link.setAttribute('href', dataUri);
        link.setAttribute('download', `慢箋紀錄備份_${todayStr}.json`);
        link.click();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data) && confirm("確定找回舊紀錄並覆蓋現有內容嗎？")) {
                    records = data; sync();
                }
            } catch (err) { alert("檔案讀取失敗"); }
            event.target.value = "";
        };
        reader.readAsText(file);
    }

    function calculateV25(r, targetDateStr) {
        const simDate = new Date(targetDateStr);
        simDate.setHours(0,0,0,0);
        const logs = r.logs.map(d => {
            const dt = new Date(d); dt.setHours(0,0,0,0); return dt;
        }).sort((a,b) => a - b);

        const firstLogDate = logs[0] || new Date(r.startDate);
        const endDate = new Date(firstLogDate);
        endDate.setDate(endDate.getDate() + 89); 

        let totalGapDays = 0;
        let currentDrugEmptyDate = new Date(logs[0]); 
        for(let i=0; i < logs.length; i++) {
            if (i > 0 && logs[i] > currentDrugEmptyDate) {
                totalGapDays += Math.floor((logs[i] - currentDrugEmptyDate) / 86400000);
            }
            let drugStartDate = (i > 0 && logs[i] < currentDrugEmptyDate) ? currentDrugEmptyDate : logs[i];
            currentDrugEmptyDate = new Date(drugStartDate);
            currentDrugEmptyDate.setDate(currentDrugEmptyDate.getDate() + r.days);
        }

        const daysPassed = Math.floor((simDate - firstLogDate) / 86400000);
        const daysRemaining = 90 - daysPassed; 
        
        let hand = (logs.length * r.days - daysPassed) + totalGapDays;
        hand = Math.max(0, Math.min(logs.length * r.days, hand));

        const progressPercent = Math.min(100, Math.max(0, (daysPassed / 90) * 100));
        const isExpired = simDate > endDate;
        const format = (d) => d.getFullYear() + "/" + String(d.getMonth()+1).padStart(2,'0') + "/" + String(d.getDate()).padStart(2,'0');
        
        let level = "primary";
        if (daysRemaining <= 7) level = "danger";
        else if (daysRemaining <= 14) level = "warning";

        return {
            hand,
            totalRemain: isExpired ? 0 : Math.max(0, (r.totalTimes - logs.length) * r.days),
            isExpired,
            status: isExpired ? "慢箋已過期" : (hand > 0 ? "服用中" : "已空窗"),
            range: `${format(firstLogDate)} - ${format(endDate)}`,
            count: logs.length,
            percent: progressPercent,
            level
        };
    }

    function runSimulation() {
        const r = {
            startDate: document.getElementById("startDate").value,
            days: parseInt(document.getElementById("days").value),
            totalTimes: parseInt(document.getElementById("totalTimes").value),
            logs: Array(parseInt(document.getElementById("usedTimes").value)).fill(document.getElementById("startDate").value)
        };
        const res = calculateV25(r, document.getElementById('simDate').value);
        const div = document.getElementById("tempResult");
        div.style.display = "block";
        div.innerHTML = `試算：手上餘藥 ${res.hand} 天<br><small>慢箋效期：${res.range}</small>`;
    }

    function saveRecord() {
        const start = document.getElementById("startDate").value;
        if(!start) return alert("請選擇日期");
        records.push({
            id: Date.now(),
            user: document.getElementById("userName").value || "家人",
            med: document.getElementById("medName").value || "藥物",
            startDate: start,
            days: parseInt(document.getElementById("days").value),
            totalTimes: parseInt(document.getElementById("totalTimes").value),
            logs: Array(parseInt(document.getElementById("usedTimes").value)).fill(start),
            isEditing: false
        });
        sync();
        document.getElementById("tempResult").style.display = 'none';
        document.getElementById("medName").value = '';
    }

    function sync() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); renderRecords(); }

    function toggleEdit(id) {
        records.forEach(r => { if(r.id === id) r.isEditing = !r.isEditing; });
        renderRecords();
    }

    function removeLogItem(btn) { btn.closest('.log-edit-item').remove(); }

    function updateRecord(id, btn) {
        const box = btn.closest('.edit-box');
        const r = records.find(rec => rec.id === id);
        r.user = box.querySelector(".e-user").value;
        r.med = box.querySelector(".e-med").value;
        r.startDate = box.querySelector(".e-start").value;
        r.days = parseInt(box.querySelector(".e-days").value);
        r.totalTimes = parseInt(box.querySelector(".e-total").value);
        const newLogs = [];
        box.querySelectorAll(".e-log-date").forEach(input => newLogs.push(input.value));
        r.logs = newLogs;
        r.isEditing = false;
        sync();
    }

    function renderRecords() {
        const container = document.getElementById("records");
        container.innerHTML = "";
        const simDateStr = document.getElementById('simDate').value;

        const groups = {};
        records.forEach(r => {
            const key = `${r.user}-${r.med}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(r);
        });

        Object.keys(groups).sort().forEach(key => {
            const groupRecords = groups[key].sort((a,b) => new Date(b.startDate) - new Date(a.startDate));
            const [user, med] = key.split('-');
            let totalHand = 0;
            groupRecords.forEach(r => totalHand += calculateV25(r, simDateStr).hand);

            const gDiv = document.createElement("div");
            gDiv.className = "group-box";
            gDiv.innerHTML = `
                <div class="group-header">
                    <div class="user-tag"><b>${user}</b><span>${med}</span></div>
                    <div class="total-badge">總餘藥：${totalHand} 天</div>
                </div>
                <div id="sub-${key}"></div>
            `;
            
            const sub = gDiv.querySelector(`#sub-${key}`);
            groupRecords.forEach(r => {
                const calc = calculateV25(r, simDateStr);
                const card = document.createElement("div");
                card.className = `card ${!calc.isExpired && calc.hand > 0 ? 'active-card' : ''}`;
                
                if (r.isEditing) {
                    let logsHtml = r.logs.map((date, idx) => `
                        <div class="log-edit-item">
                            <label style="margin:0; width:50px;">第${idx+1}次</label>
                            <input type="date" class="e-log-date" value="${date}">
                            <button class="btn-sm" onclick="removeLogItem(this)">❌</button>
                        </div>`).join('');
                    card.innerHTML = `
                        <div class="edit-box">
                            <label>對象 / 藥品名稱</label>
                            <div class="grid"><input type="text" class="e-user" value="${r.user}"><input type="text" class="e-med" value="${r.med}"></div>
                            <div class="grid">
                                <div><label>第 1 次領藥日</label><input type="date" class="e-start" value="${r.startDate}"></div>
                                <div><label>單次開立天數</label><input type="number" class="e-days" value="${r.days}"></div>
                            </div>
                            <label>總領藥次數</label><input type="number" class="e-total" value="${r.totalTimes}">
                            <label style="margin-top:10px;">領藥日期紀錄：</label>
                            ${logsHtml}
                            <div class="grid" style="margin-top:15px;">
                                <button class="btn-sm" onclick="toggleEdit(${r.id})">取消</button>
                                <button class="btn-save btn-main" style="padding:10px" onclick="updateRecord(${r.id}, this)">儲存修改</button>
                            </div>
                        </div>`;
                } else {
                    card.innerHTML = `
                        <div class="hand-status">
                            <div class="hand-num c-${calc.level}">${calc.hand}<small>天</small></div>
                            <div class="status-badge ${calc.isExpired?'pill-expired':'pill-active'}">狀態：${calc.status}</div>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar bg-${calc.level}" style="width:${calc.percent}%"></div>
                        </div>
                        <div class="info-grid">
                            <div class="info-item full">
                                <span class="info-label">慢箋效期</span>
                                <span class="info-value">${calc.range}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">手上餘藥</span>
                                <span class="info-value c-${calc.level}">${calc.hand} 天</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">領取進度</span>
                                <span class="info-value">${calc.count} / ${r.totalTimes} 次</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">未領藥量</span>
                                <span class="info-value">${calc.totalRemain} 天</span>
                            </div>
                        </div>
                        <div class="log-tags">${r.logs.map(l => `<span class="log-tag">${l}</span>`).join('')}</div>
                        <div style="display:flex; gap:10px; margin-top:15px;">
                            <button class="btn-sm btn-plus" style="flex:1" onclick="addLog(${r.id})">新增領藥</button>
                            <button class="btn-sm" onclick="toggleEdit(${r.id})">修改</button>
                            <button class="btn-sm" style="color:var(--color-danger)" onclick="deleteRecord(${r.id})">刪除</button>
                        </div>
                    `;
                }
                sub.appendChild(card);
            });
            container.appendChild(gDiv);
        });
    }

    function addLog(id) {
        const r = records.find(r => r.id === id);
        if(r.logs.length >= r.totalTimes) return alert("次數已滿");
        const d = prompt("輸入領藥日期:", document.getElementById('simDate').value);
        if(d) { r.logs.push(d); sync(); }
    }
    function deleteRecord(id) { if(confirm("確定要刪除嗎？")) { records = records.filter(r => r.id !== id); sync(); } }

    renderRecords();
</script>
</body>
</html>
